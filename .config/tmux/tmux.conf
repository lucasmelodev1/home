# =============================================================================
# tmux.conf — minimal One Dark Pro setup
# Config location: ~/.config/tmux/tmux.conf
# Reload with: prefix + r
# =============================================================================

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# -----------------------------------------------------------------------------
# General options
# -----------------------------------------------------------------------------
set -g escape-time 10
set -g history-limit 10000
set -g base-index 1
set -g renumber-windows on
set -g pane-base-index 1
set -g focus-events on
set -g mouse on
set -g display-panes-time 1500
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# -----------------------------------------------------------------------------
# Vi-style copy mode
# -----------------------------------------------------------------------------
set -g mode-keys vi
set -g status-keys vi

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
# Pane switching (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching (prefix + Ctrl-h / Ctrl-l)
bind C-h previous-window
bind C-l next-window

# Window selection by number (prefix + 1-9)
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9

# Direct window selection (Alt + 1-9)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Splits (prefix + | / -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Toggle zoom
bind m resize-pane -Z

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# -----------------------------------------------------------------------------
# Status bar — One Dark Pro (minimal)
# -----------------------------------------------------------------------------
# Palette: bg #282c34  fg #abb2bf  blue #61afef  green #98c379
#          yellow #e5c07b  orange #d19a66  red #e06c75  purple #c678dd
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-style "fg=#abb2bf,bg=#282c34"
set -g status-left-length 30
set -g status-right-length 80

# Left: session name
set -g status-left "#[fg=#282c34,bg=#61afef,bold]  #S  #[fg=#61afef,bg=#282c34,nobold]"

# Right: hostname + date/time
set -g status-right "#[fg=#5c6370,bg=#282c34] #H #[fg=#282c34,bg=#98c379,bold] %H:%M #[fg=#98c379,bg=#282c34] %d-%b-%y"

# Window list
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#282c34,bg=#98c379,bold] #I:#W #[fg=#98c379,bg=#282c34,nobold]"
set -g window-status-style "fg=#5c6370,bg=#282c34"
set -g window-status-current-style "fg=#abb2bf,bg=#282c34,bold"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"

# Messages
set -g message-style "fg=#abb2bf,bg=#2c313a"
set -g message-command-style "fg=#abb2bf,bg=#2c313a"

# -----------------------------------------------------------------------------
# Plugins (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-yank: use OSC52 so copy works in Ghostty without wl-clipboard
set -g @yank-with-osc52 on

# tmux-resurrect: restore nvim sessions via strategy
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-save every 15 min, restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'

# tmux-fzf: dedicated fuzzy finders (prefix+f sessions, w windows, p panes)
bind f run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/session.sh"
bind w run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/window.sh"
bind p run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/pane.sh"
